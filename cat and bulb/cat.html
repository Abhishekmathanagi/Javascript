<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat and Bulb</title>

    <link rel="stylesheet" href="cat.css" />

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
</head>

<body>

    <div class="dark-background text-center">

        <div>
            <img
                src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/bulb-go-on-img.png"
                class="bulb-image"
                id="bulbImage"
                alt="Bulb"
            />
        </div>

        <div>
            <img
                src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/cat-img.png"
                class="cat-image"
                id="catImage"
                alt="Cat"
            />
        </div>

        <div class="switch-container">

            <div class="switch-board">

                <h1 class="switch-status" id="switchStatus">
                    Switched On
                </h1>

                <div class="buttons-container">

                    <button
                        class="off-switch"
                        id="offSwitch"
                        onclick="switchOff()">
                        OFF
                    </button>

                    <!-- ON Button -->
                    <button
                        class="on-switch"
                        id="onSwitch"
                        onclick="switchOn()">
                        ON
                    </button>

                </div>

            </div>

        </div>

    </div>
    <script src="cat.js"></script>

</body>

</html>
